<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enon Baptist Church — Links</title>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-sky-900 via-sky-700 to-blue-500 flex items-center justify-center px-4 py-16">
    
<main class="w-full max-w-sm mx-auto flex flex-col items-center gap-6">

  
  <div class="relative">
    <div class="w-24 h-24 rounded-full ring-4 ring-white/20 overflow-hidden shadow-2xl">
      <img
        src="https://enonbaptistchatham.org.uk/images/building/new-enon-320.webp"
        alt="Enon Baptist Church"
        class="w-full h-full object-cover"
      />
    </div>
    <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-violet-500/30 to-transparent pointer-events-none"></div>
  </div>

  
  <div class="text-center">
    <h1 class="text-2xl font-bold text-white tracking-tight">Enon Baptist Church</h1>
    <p class="text-sm text-white/70 mt-2">Enon Baptist Church in Chatham</p>
  </div>

  
  <ul class="w-full flex flex-col gap-3 text-center">
    
    <li class="text-center">
      <a
        href="https://enonbaptistchatham.org.uk"
        target="_blank"
        rel="noopener noreferrer"
        class="
          flex items-center justify-center w-full
          bg-white/10 hover:bg-white/20
          border border-white/10 hover:border-white/30
          backdrop-blur-sm
          text-black
          text-bold
          rounded-2xl px-5 py-3.5
          transition-all duration-200
          hover:scale-[1.02] hover:shadow-lg hover:shadow-violet-900/40
          active:scale-[0.98]
          group
        "
      >
        <p class="font-medium text-sm text-center">Church Website</p>
      </a>
    </li>
    
    <li class="text-center">
      <a
        href="https://christian.org.uk"
        target="_blank"
        rel="noopener noreferrer"
        class="
          flex items-center justify-center w-full
          bg-white/10 hover:bg-white/20
          border border-white/10 hover:border-white/30
          backdrop-blur-sm
          text-black
          text-bold
          rounded-2xl px-5 py-3.5
          transition-all duration-200
          hover:scale-[1.02] hover:shadow-lg hover:shadow-violet-900/40
          active:scale-[0.98]
          group
        "
      >
        <p class="font-medium text-sm text-center">Christian Institute</p>
      </a>
    </li>
    
    <li class="text-center">
      <a
        href="https://christianconcern.com"
        target="_blank"
        rel="noopener noreferrer"
        class="
          flex items-center justify-center w-full
          bg-white/10 hover:bg-white/20
          border border-white/10 hover:border-white/30
          backdrop-blur-sm
          text-black
          text-bold
          rounded-2xl px-5 py-3.5
          transition-all duration-200
          hover:scale-[1.02] hover:shadow-lg hover:shadow-violet-900/40
          active:scale-[0.98]
          group
        "
      >
        <p class="font-medium text-sm text-center">Christian Concern</p>
      </a>
    </li>
    
    <li class="text-center">
      <a
        href="https://opendoorsuk.org"
        target="_blank"
        rel="noopener noreferrer"
        class="
          flex items-center justify-center w-full
          bg-white/10 hover:bg-white/20
          border border-white/10 hover:border-white/30
          backdrop-blur-sm
          text-black
          text-bold
          rounded-2xl px-5 py-3.5
          transition-all duration-200
          hover:scale-[1.02] hover:shadow-lg hover:shadow-violet-900/40
          active:scale-[0.98]
          group
        "
      >
        <p class="font-medium text-sm text-center">Open Doors</p>
      </a>
    </li>
    
    <li class="text-center">
      <a
        href="https://gbm.org.uk"
        target="_blank"
        rel="noopener noreferrer"
        class="
          flex items-center justify-center w-full
          bg-white/10 hover:bg-white/20
          border border-white/10 hover:border-white/30
          backdrop-blur-sm
          text-black
          text-bold
          rounded-2xl px-5 py-3.5
          transition-all duration-200
          hover:scale-[1.02] hover:shadow-lg hover:shadow-violet-900/40
          active:scale-[0.98]
          group
        "
      >
        <p class="font-medium text-sm text-center">Grace Baptist Mission</p>
      </a>
    </li>
    
  </ul>

  
  <p class="text-xs text-white/25 mt-4">Made with 11ty + Tailwind</p>

</main>

  </body>
</html>
